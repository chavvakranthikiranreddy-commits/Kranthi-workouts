name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm install

      - name: Copy app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Kranthi-Workouts.apk

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kranthi-Workouts-APK
          path: Kranthi-Workouts.apk

      - name: Publish APK to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kranthi Workouts build ${{ github.run_number }}
          body: Download Kranthi-Workouts.apk below on your phone and open it to install or update.
          files: Kranthi-Workouts.apk
          make_latest: true
